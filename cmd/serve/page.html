La page que le moteur attend d'un hôte web. Elle tient en trois obligations, et le
serveur qui la sert dit lesquelles : un canvas d'identifiant lozengine, la mémoire du
module exposée, et rien d'autre à faire.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lozengine</title>
<style>
  html, body { height: 100%; margin: 0; background: #101014; overflow: hidden }
  body { display: flex; align-items: center; justify-content: center }

  /* Le canvas prend la place que la page lui laisse ; c'est le moteur qui décide
     combien de pixels d'image il y met, et la taille CSS qu'il se donne en retour. */
  #lozengine { max-width: 100%; max-height: 100% }

  #erreur { color: #e0a0a0; font: 14px/1.5 system-ui, sans-serif; padding: 2rem;
            white-space: pre-wrap }

  /* Le relais de sortie reste caché tant que le module n'écrit rien : un jeu n'écrit
     jamais, et une zone vide sous le canvas lui coûterait de la place. */
  #sortie:empty { display: none }
  #sortie { position: fixed; inset: auto 0 0 0; max-height: 40%; overflow: auto;
            margin: 0; padding: .75rem 1rem; background: #181820cc; color: #c8c8d0;
            font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap }
</style>
</head>
<body>
<canvas id="lozengine" width="480" height="270"></canvas>
<pre id="sortie"></pre>
<script src="wasm_exec.js"></script>
<script>
"use strict";

// Ce que le module écrit est relayé dans la page, en plus de la console.
//
// **Deux lecteurs qu'aucune console ne sert.** Un navigateur sans écran rend le document
// et non le journal, donc un relevé d'intégration continue se lit ici ; et un téléphone
// n'a pas de console du tout, ce qui est la raison pour laquelle le relevé du temps par
// image doit s'afficher dans la page le jour où il s'y mesure.
//
// La console garde sa sortie : un développeur la lit là, et la couper pour la déplacer
// serait échanger un lecteur contre deux.
const sortie = document.getElementById("sortie");

// Le serveur attend le relevé quand il a été lancé pour cela, et la page le lui renvoie
// dès que le module dit avoir fini.
//
// **C'est ce qui remplace la lecture du document par un navigateur sans écran** : celui-ci
// rend le document au moment où il finit de charger, donc bien avant qu'un relevé de
// plusieurs secondes aboutisse, et la seule façon de le faire attendre serait de
// virtualiser son horloge — celle-là même que le relevé mesure.
let renvoye = false;
const renvoyer = () => {
  if (renvoye) { return; }
  renvoye = true;
  fetch("/releve", { method: "POST", body: sortie.textContent }).catch(() => {});
};

const relaye = (origine) => (...parts) => {
  origine(...parts);
  const ligne = parts.join(" ");
  sortie.textContent += ligne + "\n";
  if (ligne === "fin du relevé") { renvoyer(); }
};
console.log = relaye(console.log.bind(console));
console.error = relaye(console.error.bind(console));

const dire = (texte) => {
  const p = document.createElement("pre");
  p.id = "erreur";
  p.textContent = texte;
  document.body.replaceChildren(p);
};

const go = new Go();

// La chaîne de requête devient les arguments du module : ?frames=600 arrive comme
// -frames=600. C'est la seule voie qu'une page offre à des drapeaux, et elle sert aux
// commandes de mesure du dépôt sans rien demander à un jeu, qui n'en lit aucun.
go.argv = ["lozengine", ...[...new URLSearchParams(location.search)]
  .map(([nom, valeur]) => valeur === "" ? `-${nom}` : `-${nom}=${valeur}`)];

WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => {
  // La mémoire du module, sous le nom que le moteur cherche. Sans elle il présente
  // quand même, en copiant son image à chaque tour au lieu de la poser telle quelle.
  globalThis.lozengineMemory = r.instance.exports.mem;
  return go.run(r.instance);
}).catch((e) => dire("le module n'a pas démarré :\n" + e));
</script>
</body>
</html>
