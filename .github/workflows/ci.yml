# Vérification de chaque poussée et de chaque pull request.
#
# Les cibles appelées sont celles du Makefile, jamais des commandes go réécrites
# ici : deux définitions finiraient par diverger, et c'est celle du workflow qu'on
# ne peut pas essayer avant de pousser.
#
# Les tests font exception. Ils tournent nativement sur les deux plateformes, et
# le runner Windows n'a pas GNU make : ils appellent donc `go test` directement,
# ce qui reste vrai puisque la cible ne fait rien d'autre.

name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une poussée annule la précédente sur la même référence, ce qui est juste sur une
# branche de pull request : seul le dernier état compte. Jamais sur `master`, en
# revanche — le groupe étant par référence, deux fusions rapprochées y annuleraient le
# premier passage, et ce commit ne serait alors vérifié par rien.
#
# Relevé le 23 octobre 2026, et le défaut était latent : les huit fusions du jour
# étaient assez espacées pour qu'aucun passage ne soit annulé. La parade ne coûte rien,
# et le jour où deux lots se suivent de près, elle aura déjà servi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Un seul job pour les sept étapes : elles sont rapides, sans dépendance à
  # installer, et les séparer multiplierait les contextes à nommer dans la
  # protection de branche sans rien apprendre de plus.
  controles:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # La version vient de go.mod : la répéter ici créerait un second
          # endroit à mettre à jour, et personne ne penserait aux deux.
          go-version-file: go.mod
          check-latest: true

      # Formatage, vet, absence de dépendance externe, mentions de licence,
      # étanchéité de la frontière, compilation croisée, tests. La liste se passe
      # entière, ici comme en local.
      - name: Contrôle complet
        run: make check

  # La compilation croisée du job précédent prouve que le code compile pour chacun
  # des couples annoncés ; elle ne dit rien de ce qu'il fait une fois exécuté. D'où
  # ce job : « tourne » est une autre promesse que « compile », et elle ne vaut que
  # là où la suite passe nativement — `amd64` sur les deux systèmes.
  #
  # Les deux bouts de la plage annoncée, et pas seulement l'un d'eux. N'éprouver
  # que la dernière version laisserait le plancher de go.mod dériver sans que rien
  # ne le dise ; n'éprouver que le plancher manquerait ce qu'une version récente
  # refuse.
  #
  # Le plancher se lit dans go.mod et ne s'écrit pas ici : recopié, il finirait par
  # diverger, et c'est la valeur du workflow qu'on ne peut pas essayer avant de
  # pousser.
  tests:
    name: Tests — ${{ matrix.os }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [plancher, dernière]
    steps:
      - uses: actions/checkout@v7

      # `shell: bash` parce que le runner Windows exécute `run` en PowerShell par
      # défaut, qui ne connaît pas awk.
      - name: Version à installer
        id: go
        shell: bash
        run: |
          if [ "${{ matrix.go }}" = "plancher" ]; then
            echo "version=$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"
          else
            echo "version=stable" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}

      # La suite de non-régression est visuelle mais passe par le rastériseur
      # logiciel : aucun test n'ouvre de fenêtre, et les runners n'ont pas
      # d'écran.
      - name: Tests
        run: go test ./...
        env:
          CGO_ENABLED: 0

  # Le seul contexte que la protection de branche exige, et la raison en vaut la
  # peine : elle désigne les contrôles par leur nom, si bien qu'ajouter une ligne
  # de matrice ou renommer un job rendait le contexte requis introuvable — et la
  # pull request attendait indéfiniment quelque chose qui ne tournerait jamais.
  #
  # Avec un nom stable qui dépend de tous les autres, la matrice évolue librement
  # et la protection ne bouge plus.
  #
  # `if: always()` pour que le bilan s'exécute même quand un job échoue, sans quoi
  # il serait simplement sauté — et un contexte sauté ne bloque rien. C'est donc
  # lui qui doit lire les résultats et échouer à leur place.
  # Le plancher déclaré n'est pas le plancher réel tant que rien ne le mesure. Le job
  # `tests` installe la version que go.mod annonce : il ne peut donc pas dire qu'elle
  # est trop haute, et le plancher a dérivé jusqu'à 1.24 sans qu'il bronche.
  #
  # Ce job exige un échec, et c'est le seul moyen de garder un plancher : la version
  # juste en dessous doit refuser de construire le dépôt. Si elle y arrive, le plancher
  # exclut des consommateurs pour rien — ils doivent télécharger une autre chaîne, et
  # échouent net quand `GOTOOLCHAIN=local` le leur interdit.
  #
  # La directive de go.mod est abaissée avant l'essai, dans le dépôt éphémère du
  # runner : sans cela Go refuserait sur la directive elle-même et non sur le code, ce
  # qui passerait pour une mesure réussie alors qu'elle n'aurait rien mesuré.
  plancher:
    name: Plancher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version juste en dessous du plancher
        id: sous
        run: |
          plancher=$(awk '/^go /{print $2; exit}' go.mod)
          majeur=${plancher%%.*}
          reste=${plancher#*.}
          mineur=${reste%%.*}
          if [ "$mineur" -le 0 ]; then
            echo "::error::plancher $plancher : aucune version inférieure à essayer."
            exit 1
          fi
          echo "plancher=$plancher" >> "$GITHUB_OUTPUT"
          echo "version=$majeur.$((mineur - 1)).0" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.sous.outputs.version }}

      - name: La version inférieure doit échouer
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: 0
        run: |
          # `setup-go` installe un matcher de problèmes qui transforme la sortie de go
          # en annotations d'échec. Ici l'échec est le résultat attendu : sans ce
          # retrait, un job vert remonte huit erreurs au récapitulatif de la pull
          # request, et qui les lit croit que quelque chose est cassé.
          echo "::remove-matcher owner=go::"

          sous="${{ steps.sous.outputs.version }}"
          sed -i "s/^go .*/go $sous/" go.mod

          echo "::group::Ce que Go $sous refuse de construire"
          vet=0
          go vet ./... || vet=$?
          echo "::endgroup::"

          if [ "$vet" -eq 0 ]; then
            echo "::error::Go $sous construit le dépôt : le plancher ${{ steps.sous.outputs.plancher }} de go.mod est trop haut."
            exit 1
          fi
          echo "Go $sous échoue, comme attendu : le plancher déclaré est bien le minimum."

  bilan:
    name: Bilan
    if: always()
    needs: [controles, tests, plancher]
    runs-on: ubuntu-latest
    steps:
      - name: Résultat des contrôles
        run: |
          echo "contrôles : ${{ needs.controles.result }}"
          echo "tests     : ${{ needs.tests.result }}"
          echo "plancher  : ${{ needs.plancher.result }}"
          [ "${{ needs.controles.result }}" = "success" ] || exit 1
          [ "${{ needs.tests.result }}" = "success" ] || exit 1
          [ "${{ needs.plancher.result }}" = "success" ] || exit 1
