# Vérification de chaque poussée et de chaque pull request.
#
# Les cibles appelées sont celles du Makefile, jamais des commandes go réécrites
# ici : deux définitions finiraient par diverger, et c'est celle du workflow qu'on
# ne peut pas essayer avant de pousser.
#
# Les tests font exception. Ils tournent nativement sur les deux plateformes, et
# le runner Windows n'a pas GNU make : ils appellent donc `go test` directement,
# ce qui reste vrai puisque la cible ne fait rien d'autre.

name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Appelable par la publication, qui rejoue les quatre jobs au lieu du seul
  # `make check` : un tag se pose sur un commit, et ce qui l'a vérifié doit être
  # ce qui vérifie une pull request, sans second texte à tenir d'accord.
  workflow_call:

permissions:
  contents: read

# Une poussée annule la précédente sur la même référence, ce qui est juste sur une
# branche de pull request : seul le dernier état compte. Jamais sur `master`, en
# revanche — le groupe étant par référence, deux fusions rapprochées y annuleraient le
# premier passage, et ce commit ne serait alors vérifié par rien.
#
# Relevé le 23 octobre 2026, et le défaut était latent : les huit fusions du jour
# étaient assez espacées pour qu'aucun passage ne soit annulé. La parade ne coûte rien,
# et le jour où deux lots se suivent de près, elle aura déjà servi.
# **Le groupe est une constante et non `github.workflow`**, parce que ce workflow est
# appelable : la variable y vaudrait le nom de l'appelant, donc « Publication », à un
# caractère de casse du groupe que la publication se donne. Deux groupes qui se
# confondraient feraient attendre l'appelé derrière l'appelant, c'est-à-dire un
# interblocage qu'on ne verrait qu'au tag.
#
# Et jamais d'annulation sur un tag : une publication interrompue laisse un tag sans
# notes, ce que la publication refuse déjà pour elle-même.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/master' }}

jobs:
  # Un seul job pour les sept étapes : elles sont rapides, sans dépendance à
  # installer, et les séparer multiplierait les contextes à nommer dans la
  # protection de branche sans rien apprendre de plus.
  controles:
    name: Contrôles
    runs-on: ubuntu-latest
    # Sans borne, un job hérite des six heures de la plateforme : une étape qui
    # pend immobilise un runner et laisse la pull request attendre sans rien dire.
    # Les bornes sont larges au regard de ce que la chaîne prend — quelques
    # minutes —, assez pour qu'un runner lent ne rougisse pas pour autant.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # La version vient de go.mod : la répéter ici créerait un second
          # endroit à mettre à jour, et personne ne penserait aux deux.
          go-version-file: go.mod
          check-latest: true
          # Ce module n'a pas de `go.sum` — son `go.mod` est vide et le reste.
          # Sans cette ligne, le cache de `setup-go` dérive sa clé d'un fichier
          # de dépendances absent : il s'écrit une fois et ne se rafraîchit
          # jamais, donc il sert le cache de compilation d'un autre état du
          # dépôt. La clé suit `go.mod`, qui est ce que ce module a.
          cache-dependency-path: go.mod

      # Formatage, vet, absence de dépendance externe, mentions de licence,
      # étanchéité de la frontière, compilation croisée, tests. La liste se passe
      # entière, ici comme en local.
      - name: Contrôle complet
        run: make check

  # La compilation croisée du job précédent prouve que le code compile pour chacun
  # des couples annoncés ; elle ne dit rien de ce qu'il fait une fois exécuté. D'où
  # ce job : « tourne » est une autre promesse que « compile », et elle ne vaut que
  # là où la suite passe nativement — `amd64` sur les deux systèmes.
  #
  # Les deux bouts de la plage annoncée, et pas seulement l'un d'eux. N'éprouver
  # que la dernière version laisserait le plancher de go.mod dériver sans que rien
  # ne le dise ; n'éprouver que le plancher manquerait ce qu'une version récente
  # refuse.
  #
  # Le plancher se lit dans go.mod et ne s'écrit pas ici : recopié, il finirait par
  # diverger, et c'est la valeur du workflow qu'on ne peut pas essayer avant de
  # pousser.
  tests:
    name: Tests — ${{ matrix.os }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [plancher, dernière]
    steps:
      - uses: actions/checkout@v7

      # `shell: bash` parce que le runner Windows exécute `run` en PowerShell par
      # défaut, qui ne connaît pas awk.
      - name: Version à installer
        id: go
        shell: bash
        run: |
          if [ "${{ matrix.go }}" = "plancher" ]; then
            echo "version=$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"
          else
            echo "version=stable" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: go.mod

      # La suite de non-régression est visuelle mais passe par le rastériseur
      # logiciel : elle n'ouvre aucune fenêtre, et les runners n'ont pas d'écran.
      #
      # Un cas en ouvre une depuis le jalon 3, et il se saute ici faute de serveur
      # d'affichage — c'est le job `Affichage` qui lui en fournit un et lui interdit
      # de se sauter.
      - name: Tests
        run: go test ./...
        env:
          CGO_ENABLED: 0

  # Tout ce qui précède éprouve le moteur sans écran. Ce job est le seul qui parle à
  # un vrai serveur d'affichage, et c'est lui qui dit si le backend X11 parle
  # correctement le protocole : le reste ne le vérifie que contre une paire de
  # sockets qui joue le serveur.
  #
  # **Les deux serveurs sans écran, dans une matrice, parce que c'est le même
  # harnais** : seul ce qui écoute derrière change. Xvfb est un serveur X complet et
  # autonome ; Xwayland est un client Wayland, donc il lui faut un compositeur, et
  # c'est pourquoi la seconde ligne installe weston. Ni l'un ni l'autre n'a de
  # gestionnaire de fenêtres, donc ce job ne dit rien du reparentage, des décorations
  # ni du vrai chemin de fermeture.
  #
  # **`fail-fast: false` parce que les deux verdicts sont distincts** : un backend qui
  # marche sous Xvfb et pas sous Xwayland est précisément ce qu'on veut apprendre, et
  # couper la matrice au premier échec le cacherait.
  #
  # Le dispositif s'installe ici et nulle part ailleurs : un runner s'installe,
  # s'éprouve et se jette, là où une machine de développement partagée garderait les
  # paquets sans que personne ne sache plus pourquoi.
  affichage:
    name: Affichage — ${{ matrix.serveur }}
    runs-on: ubuntu-latest

    # **Une borne, parce que ce job peut attendre indéfiniment.** Le 27 octobre 2026,
    # l'installation des paquets de Xwayland a tenu dix-huit minutes sans avancer — et
    # sans borne elle aurait tenu les six heures que la plateforme accorde. Un job qui
    # échoue se lit ; un job qui attend ne dit rien et bloque la pull request derrière
    # lui.
    #
    # C'est la même leçon que le harnais de test a apprise le même jour, sur un cas qui
    # a figé un paquet dix minutes : ce qui peut attendre sans fin se borne.
    #
    # **Quatre minutes, et le chiffre vient d'une mesure** : les quatre passages
    # réussis tiennent entre 47 et 66 secondes. Près de quatre fois la durée observée
    # absorbe un runner chargé ; un plafond plus large ne protégerait pas mieux et
    # ferait seulement attendre plus longtemps avant de dire qu'il y a un problème —
    # le premier était à douze minutes, posé avant d'avoir mesuré quoi que ce soit.
    #
    # Il tient compte du délai sur le verrou de l'étape suivante, qui doit rester bien
    # dedans : les deux bornes se marcheraient dessus si l'attente permise à l'une
    # consommait le budget de l'autre.
    timeout-minutes: 4

    strategy:
      fail-fast: false
      matrix:
        include:
          # `clavier` dit si une touche injectée peut atteindre la fenêtre. Sous Xvfb
          # oui, le focus se posant par une requête du protocole. Sous Xwayland non :
          # le focus clavier appartient au compositeur, et un compositeur sans écran
          # ni shell interactif n'en donne à personne — mesuré le 27 octobre 2026, la
          # touche part et n'arrive nulle part. Ce n'est pas un défaut du moteur, et
          # prétendre l'éprouver là serait faux.
          - serveur: Xvfb
            paquets: xvfb x11-utils xdotool
            clavier: "oui"
          - serveur: Xwayland
            paquets: weston xwayland x11-utils xdotool
            clavier: "non"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # **`DEBIAN_FRONTEND` n'est pas une politesse, c'est ce qui empêche l'attente.**
      # Une dépendance de weston pose une question de configuration, et sans cette
      # variable l'installation attend une réponse que personne ne donnera jamais.
      # C'est ce qui a bloqué le job de Xwayland le 27 octobre 2026, là où celui de
      # Xvfb passait : seul le premier tire le paquet qui demande.
      #
      # **Cette étape n'est pas silencieuse, et c'est ce qui a donné la cause.** Le
      # 27 octobre 2026 elle a attendu cinq minutes sans écrire une ligne avant que le
      # plafond du job la coupe : `-qq` taisait tout, si bien qu'on ne pouvait pas
      # distinguer un travail en cours d'une attente. Rendue bavarde, elle a répondu au
      # passage suivant.
      #
      # **Ce que la mesure dit, et qui n'était aucune des causes supposées** : aucun
      # verrou n'était tenu, et deux téléchargements du même job sont allés à
      # 9 948 kB/s et à 73 kB/s — un facteur cent trente-cinq. C'est la vitesse du
      # réseau du runner qui varie, non `debconf` ni la contention de verrous.
      #
      # **Donc la parade qui compte est le plafond du job**, qui transforme une attente
      # réseau en échec lisible et laisse une relance repartir sur un autre miroir.
      # Rien ici ne rendra le réseau fiable.
      #
      # Ce qui suit reste quand même, parce que cela ferme deux autres causes possibles
      # sans rien coûter : le frontend non interactif, pour qu'une question de
      # configuration n'attende jamais de réponse ; l'arrêt des minuteries du runner et
      # le relevé des verrous, pour que le journal tranche tout de suite si une
      # prochaine fois ce sont eux.
      - name: Paquets du serveur
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo fuser -v /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>&1 || echo "aucun verrou tenu"

          sudo apt-get update -o DPkg::Lock::Timeout=60
          sudo apt-get install -y -o DPkg::Lock::Timeout=60 ${{ matrix.paquets }}

      # Les deux répertoires sont créés à la main, et ce n'est pas une précaution :
      # mesuré en conteneur le 27 octobre 2026, Xwayland échoue par
      # « failed to bind to /tmp/.X11-unix/X0: No such file or directory » quand le
      # premier manque, et weston refuse de démarrer sans le second.
      #
      # **Mais la création tolère qu'il soit déjà là, et c'est un fait de runner qu'un
      # conteneur ne reproduit pas** : ici le répertoire existe et appartient à root,
      # donc en changer les droits est refusé — et avec `bash -e`, l'étape s'arrêtait
      # là. Les deux jobs ont échoué ainsi au premier passage, sur une ligne de
      # préparation et non sur le serveur.
      #
      # Taire ce refus ne cache rien : si le répertoire manquait vraiment, le serveur
      # ne pourrait pas y ouvrir sa socket, et c'est l'attente ci-dessous qui le dirait
      # — avec le journal du serveur, donc mieux.
      #
      # L'attente se fait sur la socket et non sur une durée fixe : un `sleep` assez
      # long pour être sûr serait du temps perdu à chaque passage, et un `sleep` trop
      # court donnerait un échec intermittent qu'on chercherait dans le backend.
      - name: Serveur sans écran
        run: |
          mkdir -p /tmp/.X11-unix 2>/dev/null || true
          chmod 1777 /tmp/.X11-unix 2>/dev/null || true
          export XDG_RUNTIME_DIR=/tmp/lozengine-run
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          case "${{ matrix.serveur }}" in
            Xvfb)
              Xvfb :99 -screen 0 1280x1024x24 >/tmp/serveur.log 2>&1 &
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              attendu=/tmp/.X11-unix/X99
              ;;
            Xwayland)
              weston --backend=headless-backend.so --xwayland \
                     --socket=lozengine-wayland >/tmp/serveur.log 2>&1 &
              echo "DISPLAY=:0" >> "$GITHUB_ENV"
              attendu=/tmp/.X11-unix/X0
              ;;
          esac

          for _ in $(seq 100); do
            [ -e "$attendu" ] && break
            sleep 0.2
          done
          if [ ! -e "$attendu" ]; then
            echo "le serveur n'a pas ouvert $attendu :"
            cat /tmp/serveur.log
            exit 1
          fi

      # Le relevé que le brief du jalon attendait, et qui ne coûte rien ici : il dit
      # l'ordre des octets d'image, la taille maximale d'une requête et les masques
      # des visuels — dont tout le transfert d'image dépend — et quelles extensions
      # le serveur porte. Il est consigné dans le journal du job plutôt que vérifié,
      # parce que c'est une observation et non une promesse.
      - name: Relevé du serveur
        run: |
          xdpyinfo | grep -iE "name of display|version number|image byte order|maximum request size|depth of root window"
          xdpyinfo | grep -i "red, green, blue masks" | head -1
          xdpyinfo -queryExtensions | grep -E "^    (MIT-SHM|BIG-REQUESTS|XKEYBOARD)" || true

      # `LOZENGINE_DISPLAY` interdit au cas de se sauter. Sans elle, un serveur qui
      # n'aurait pas démarré laisserait ce job vert en sautant le seul cas qu'il
      # existe pour exécuter — et un saut n'est pas un échec.
      #
      # **Et le verdict vient de la trace, pas du code de sortie** : `go test` sort avec
      # zéro quand son motif ne correspond à aucun cas, donc renommer celui-ci
      # emporterait sans un mot la seule assertion du dépôt qui parle à un vrai serveur
      # X11. Le garde-fou ci-dessus couvre le saut et laissait ouverte la disparition,
      # qui est le même dégât en plus grand. Le `grep` est ce qui la refuse, et c'est le
      # geste que la cible `vet` applique déjà en lisant une sortie plutôt qu'un code.
      - name: Le serveur détient ce qu'on lui a remis
        run: |
          go test -count=1 -v -run TestTheServerHoldsExactlyWhatWasPresented ./internal/backend/ > result.log 2>&1 || true
          cat result.log
          grep -q "^--- PASS: TestTheServerHoldsExactlyWhatWasPresented " result.log
        env:
          CGO_ENABLED: 0
          LOZENGINE_DISPLAY: 1

      # Le critère de fin du jalon demande que **l'exemple** tourne, et non qu'un cas
      # de test passe : celui-ci ouvre la fenêtre directement, sans traverser la
      # boucle à pas fixe ni l'agrandissement vers la fenêtre. Cette étape éprouve
      # l'assemblage entier, et c'est la seule du dépôt qui le fasse.
      #
      # **Les deux assertions portent sur un contenu connu, jamais sur une absence
      # d'erreur** : un job sans écran ne remarque pas que rien ne s'affiche, donc
      # « le processus n'a pas planté » ne vaudrait presque rien.
      #
      #   1. le serveur porte une fenêtre dont le nom est celui que l'exemple pose,
      #      ce qui dit que l'ouverture et le titre ont abouti ;
      #   2. une vraie touche d'échappement le fait **sortir avec un code nul**, ce
      #      qui dit que la boucle tourne, que le clavier arrive jusqu'au jeu et que
      #      la sortie est propre. Aucun test ne traverse ce chemin.
      #
      # La touche part par le serveur lui-même et non par un signal : c'est ce qui
      # fait la différence entre éprouver le clavier et éprouver `kill`.
      #
      # **La fenêtre se cherche par `xdotool` et non en filtrant la liste des
      # fenêtres**, et ce détail a coûté un essai : l'outil d'inspection lit la
      # propriété de nom d'origine, dont le type ne porte que du latin-1, alors que le
      # titre de l'exemple contient un tiret cadratin. Le nom n'y apparaît donc pas,
      # là où `xdotool` lit aussi la propriété UTF-8 que le backend pose en second.
      - name: L'exemple ouvre sa fenêtre et répond au clavier
        run: |
          go build -o /tmp/lozengine-walk ./examples/walk
          /tmp/lozengine-walk &
          exemple=$!

          fenetre=
          for _ in $(seq 100); do
            fenetre=$(xdotool search --name lozengine 2>/dev/null | head -1 || true)
            [ -n "$fenetre" ] && break
            kill -0 "$exemple" 2>/dev/null || break
            sleep 0.2
          done

          if [ -z "$fenetre" ]; then
            echo "le serveur ne porte aucune fenêtre nommée par l'exemple"
            kill "$exemple" 2>/dev/null || true
            exit 1
          fi
          echo "fenêtre de l'exemple : $fenetre"

          if [ "${{ matrix.clavier }}" != "oui" ]; then
            # Là où le focus clavier n'existe pour personne, l'assertion s'arrête à
            # ce qui est vérifiable : l'exemple a ouvert sa fenêtre nommée et il la
            # tient encore. C'est moins que sous l'autre serveur, et c'est dit.
            if ! kill -0 "$exemple" 2>/dev/null; then
              echo "l'exemple s'est arrêté après avoir ouvert sa fenêtre"
              exit 1
            fi
            kill "$exemple"
            exit 0
          fi

          # Le focus se pose explicitement : sans gestionnaire de fenêtres personne ne
          # l'attribue, et une touche injectée irait à ce qui se trouve sous le
          # pointeur. Cela marche par hasard quand la fenêtre est placée à l'origine,
          # et se casserait au premier changement de placement.
          xdotool windowfocus "$fenetre"
          xdotool key --clearmodifiers Escape

          # C'est l'exemple qui décide de partir : on attend sa sortie plutôt que de
          # la provoquer, et son code nul est l'assertion.
          for _ in $(seq 50); do
            kill -0 "$exemple" 2>/dev/null || break
            sleep 0.2
          done

          if kill -0 "$exemple" 2>/dev/null; then
            kill "$exemple" 2>/dev/null || true
            echo "l'exemple n'a pas répondu à l'échappement"
            exit 1
          fi
          wait "$exemple"
        env:
          CGO_ENABLED: 0

  # Le seul contexte que la protection de branche exige, et la raison en vaut la
  # peine : elle désigne les contrôles par leur nom, si bien qu'ajouter une ligne
  # de matrice ou renommer un job rendait le contexte requis introuvable — et la
  # pull request attendait indéfiniment quelque chose qui ne tournerait jamais.
  #
  # Avec un nom stable qui dépend de tous les autres, la matrice évolue librement
  # et la protection ne bouge plus.
  #
  # `if: always()` pour que le bilan s'exécute même quand un job échoue, sans quoi
  # il serait simplement sauté — et un contexte sauté ne bloque rien. C'est donc
  # lui qui doit lire les résultats et échouer à leur place.
  # Le plancher déclaré n'est pas le plancher réel tant que rien ne le mesure. Le job
  # `tests` installe la version que go.mod annonce : il ne peut donc pas dire qu'elle
  # est trop haute, et le plancher a dérivé jusqu'à 1.24 sans qu'il bronche.
  #
  # Ce job exige un échec, et c'est le seul moyen de garder un plancher : la version
  # juste en dessous doit refuser de construire le dépôt. Si elle y arrive, le plancher
  # exclut des consommateurs pour rien — ils doivent télécharger une autre chaîne, et
  # échouent net quand `GOTOOLCHAIN=local` le leur interdit.
  #
  # La directive de go.mod est abaissée avant l'essai, dans le dépôt éphémère du
  # runner : sans cela Go refuserait sur la directive elle-même et non sur le code, ce
  # qui passerait pour une mesure réussie alors qu'elle n'aurait rien mesuré.
  plancher:
    name: Plancher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Version juste en dessous du plancher
        id: sous
        run: |
          plancher=$(awk '/^go /{print $2; exit}' go.mod)
          majeur=${plancher%%.*}
          reste=${plancher#*.}
          mineur=${reste%%.*}
          if [ "$mineur" -le 0 ]; then
            echo "::error::plancher $plancher : aucune version inférieure à essayer."
            exit 1
          fi
          echo "plancher=$plancher" >> "$GITHUB_OUTPUT"
          echo "version=$majeur.$((mineur - 1)).0" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.sous.outputs.version }}
          cache-dependency-path: go.mod

      - name: La version inférieure doit échouer
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: 0
        run: |
          # `setup-go` installe un matcher de problèmes qui transforme la sortie de go
          # en annotations d'échec. Ici l'échec est le résultat attendu : sans ce
          # retrait, un job vert remonte huit erreurs au récapitulatif de la pull
          # request, et qui les lit croit que quelque chose est cassé.
          echo "::remove-matcher owner=go::"

          sous="${{ steps.sous.outputs.version }}"
          sed -i "s/^go .*/go $sous/" go.mod

          # Les deux plateformes, parce qu'un `go vet ./...` sous Linux ne compile
          # aucun fichier `_windows.go`. Si le plancher n'était exigé que par du code
          # Windows, cette passe réussirait et le job conclurait que le plancher est
          # trop haut — un faux positif qui enverrait l'abaisser à tort.
          #
          # Le plancher est juste dès qu'**une** des deux refuse : ce qu'on démontre
          # est qu'aucune version inférieure ne construit le dépôt entier.
          refus=0
          for os in linux windows; do
            echo "::group::Ce que Go $sous refuse de construire pour $os"
            if GOOS=$os go vet ./...; then
              echo "$os : construit."
            else
              echo "$os : refuse."
              refus=$((refus + 1))
            fi
            echo "::endgroup::"
          done

          if [ "$refus" -eq 0 ]; then
            echo "::error::Go $sous construit le dépôt sur les deux plateformes : le plancher ${{ steps.sous.outputs.plancher }} de go.mod est trop haut."
            exit 1
          fi
          echo "Go $sous échoue sur $refus plateforme(s), comme attendu : le plancher déclaré est bien le minimum."

  bilan:
    name: Bilan
    if: always()
    needs: [controles, tests, affichage, plancher]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Un job ajouté à la liste des dépendances sans l'être à celle des tests
      # serait attendu sans être lu : le bilan passerait au vert sur son échec, et
      # la protection de branche n'y verrait rien. Les deux listes se tiennent donc
      # d'accord, et c'est la seule chose à vérifier en ajoutant un job.
      - name: Résultat des contrôles
        run: |
          echo "contrôles : ${{ needs.controles.result }}"
          echo "tests     : ${{ needs.tests.result }}"
          echo "affichage : ${{ needs.affichage.result }}"
          echo "plancher  : ${{ needs.plancher.result }}"
          [ "${{ needs.controles.result }}" = "success" ] || exit 1
          [ "${{ needs.tests.result }}" = "success" ] || exit 1
          [ "${{ needs.affichage.result }}" = "success" ] || exit 1
          [ "${{ needs.plancher.result }}" = "success" ] || exit 1
